# HARNESSKBD build variant of m8.cfg: identical layout, distinct output
# names so the two builds of asm/m8.s never clobber each other.
#
# 8fish on-device UI (asm/m8.s). TWO output files from one link:
#
#   m8boot.bin  $0800  the run-once copier (BRUN it; the engine later
#                      overwrites $0800 with PIECESQ, which is exactly why
#                      the UI costs zero permanent MAIN bytes)
#   m8.bin      $E000  the UI itself, BLOADed at $0900 (engine per-ply arrays
#                      and MOVESTACK — garbage until the first search) and
#                      copied up by the copier
#
# LC's size caps the UI's code+static data at $E000-$F6FF = 5,888 bytes. The
# rest of the Language Card is the UI's RAM (see the map at the top of
# asm/ui.s), so overflowing the code budget is a LINK ERROR rather than a
# silent overwrite of the game history.
# SPLMEM/SPLASH and the D2 page-fill mirror m8.cfg: the SPLASH segment must
# resolve in every link of asm/m8.s even though the HARNESSKBD build never runs
# it (RWTSDEF is 0, so m8main skips m8splash). See m8.cfg for the full account.
MEMORY {
    BOOT:   start = $0800, size = $0100, file = "m8tboot.bin";
    LC:     start = $E000, size = $1700, file = %O;
    D2:     start = $D700, size = $0900, file = %O;
    SPLMEM: start = $F800, size = $0200, file = %O;
    # The transient save/load orchestrator (asm/saveload.s): linked HERE so it
    # can name UI symbols, emitted to its OWN file -- it ships as the SAVELOAD
    # disk file, not in the payload. Size = its $1A00-$1FFF run window.
    SL:     start = $1A00, size = $0600, file = "m8tsaveload.bin";
}
SEGMENTS {
    BOOT:    load = BOOT,   type = rw;
    UICODE:  load = LC,     type = rw, define = yes;
    UIDATA2: load = D2,     type = rw, define = yes, align = $100;
    SPLASH:  load = SPLMEM, type = rw, define = yes;
    SAVELOAD: load = SL,    type = rw, define = yes;
}
SYMBOLS {
    # Where the copier finds the payload (asm/m8.s imports it).
    UIPAYLOAD: type = export, value = $0900;
}
