# 8fish on-device UI (asm/m8.s). TWO output files from one link:
#
#   m8boot.bin  $0800  the run-once copier (BRUN it; the engine later
#                      overwrites $0800 with PIECESQ, which is exactly why
#                      the UI costs zero permanent MAIN bytes)
#   m8.bin      $E000  the UI itself, BLOADed at $0900 (engine per-ply arrays
#                      and MOVESTACK — garbage until the first search) and
#                      copied up by the copier
#
# LC's size caps the UI's code+static data at $E000-$F6FF = 5,888 bytes. The
# rest of the Language Card is the UI's RAM (see the map at the top of
# asm/ui.s), so overflowing the code budget is a LINK ERROR rather than a
# silent overwrite of the game history.
MEMORY {
    BOOT: start = $0800, size = $0100, file = "m8boot.bin";
    LC:   start = $E000, size = $1700, file = %O;
}
SEGMENTS {
    BOOT:   load = BOOT, type = rw;
    UICODE: load = LC,   type = rw, define = yes;
}
