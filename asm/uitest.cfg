# Proof-of-concept image for the on-device UI renderer (asm/ui.s).
#
# Mirrors the shipping plan exactly: a small stub is loaded at $4000 (where
# the engine image lives), enables Language Card bank-1 RAM read+write with
# the same $C08B double read engine.s uses, copies the UICODE segment up to
# $E000, and jumps there. The UI therefore runs from LC RAM and costs zero
# bytes of the engine's $4000-$BEFF footprint.
MEMORY {
    MAIN: start = $4000, size = $7F00, file = %O;
    LC:   start = $E000, size = $1FF0, file = "";
}
SEGMENTS {
    CODE:   load = MAIN,          type = rw;
    UICODE: load = MAIN, run = LC, type = rw, define = yes;
}
