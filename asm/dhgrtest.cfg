# Proof-of-concept image for the double-hi-res board renderer (asm/dhgr.s).
#
# Mirrors asm/uitest.cfg: a stub at $4000 enables Language Card bank-1 RAM
# read+write with the same $C08B double read engine.s uses, copies the UICODE
# segment up to $E000, and jumps there, so the renderer runs from the address
# it will really run at.
#
# The tile blob is linked into main RAM after the stub — well clear of DHGR
# page 1 ($2000-$3FFF), which the renderer writes. In the shipping build the
# blob is lifted into the otherwise unused LC bank 2 instead; the renderer
# reaches it only through the DHTILES symbol, so its address is a link-time
# detail either way.
MEMORY {
    MAIN: start = $4000, size = $7F00, file = %O;
    LC:   start = $E000, size = $1FF0, file = "";
}
SEGMENTS {
    CODE:   load = MAIN,          type = rw;
    TILES:  load = MAIN,          type = rw;
    UICODE: load = MAIN, run = LC, type = rw, define = yes;
}
