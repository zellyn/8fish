# 8fish on-device UI (asm/m8.s). TWO output files from one link:
#
#   m8boot.bin  $0800  the run-once copier (BRUN it; the engine later
#                      overwrites $0800 with PIECESQ, which is exactly why
#                      the UI costs zero permanent MAIN bytes)
#   m8.bin      $E000  the UI itself, BLOADed at $0900 (engine per-ply arrays
#                      and MOVESTACK — garbage until the first search) and
#                      copied up by the copier
#
# LC's size caps the UI's code+static data at $E000-$F6FF = 5,888 bytes. The
# rest of the Language Card is the UI's RAM (see the map at the top of
# asm/ui.s), so overflowing the code budget is a LINK ERROR rather than a
# silent overwrite of the game history.
#
# D2 is LANGUAGE CARD BANK 2, above the opening book's name table
# ($D000-$D6FF after page rounding): the UI's read-only strings and cold
# tables (the UIDATA2 segment) live there, read through a bank-2 window
# (asm/ui.s uiputs and friends), so they cost the $E000-$F6FF code budget
# nothing. The copier lifts them from the payload file, where they sit
# immediately after UICODE; overflowing bank 2 is a link error too.
# SPLASH is the boot title-card code (asm/m8.s m8splash + its PackBits
# decoder). The $E000-$F6FF UICODE budget is full, so it is staged after
# UIDATA2 in the payload and the copier lifts it to $F800 -- the ply-history
# region ($F800-$FAFF: UIHFROM/UIHTO/UIHFLAG), all three pages dead until m8new
# runs AFTER the splash and resets UIHCNT. It runs bank-independent in the
# resting bank 1, so it needs no bank switching. The $0200 cap lets it borrow
# the first two reclaimed pages ($F800-$F9FF); a link error fires only if it
# grows past that into UIHFLAG at $FA00 (the third page is left as headroom).
MEMORY {
    BOOT:   start = $0800, size = $0100, file = "m8boot.bin";
    LC:     start = $E000, size = $1700, file = %O;
    # UIDATA2 is page-aligned by a .align at its end (asm/m8.s), so it occupies
    # a whole number of pages in the payload: the copier then finds the SPLASH
    # segment exactly where its UIDATA2 copy left ZPTR, saving a pointer setup in
    # the full $0D00 copier.
    D2:     start = $D700, size = $0900, file = %O;
    SPLMEM: start = $F800, size = $0200, file = %O;
}
SEGMENTS {
    BOOT:    load = BOOT,   type = rw;
    UICODE:  load = LC,     type = rw, define = yes;
    UIDATA2: load = D2,     type = rw, define = yes, align = $100;
    SPLASH:  load = SPLMEM, type = rw, define = yes;
}
SYMBOLS {
    # Where the copier finds the payload (asm/m8.s imports it).
    UIPAYLOAD: type = export, value = $0900;
}
