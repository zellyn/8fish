# STANDARD DELIVERY layout of asm/m8.s: the copier and the payload moved up
# out of the BLOAD layout's $0800, so that the single contiguous image the boot
# loader delivers (the base through the end of engine.bin) fits diskii mksd's
# 45,056-byte cap. See internal/delivery (which owns the base and the margin
# table) and internal/ui's TestDiskLedger for the arithmetic. The base moved
# $0C00 -> $0D00 on 2026-07-30 to pay for the engine's pre-make evasion filter;
# keep it equal to internal/delivery.Base.
#
#   m8sdboot.bin  $0D00  the run-once copier, identical code to m8boot.bin
#                        except for the two bytes of the payload address
#   m8sd.bin      $E000  the payload — byte-identical to m8.bin, because
#                        nothing in it depends on where it was staged.
#                        cmd/mkdsk asserts that identity and ships m8.bin.
#
# Both $0D00 and $0E00-$1FFF are engine RAM (per-ply arrays, then MOVESTACK)
# that holds garbage until the first search, so the copier and the staged
# payload still cost the engine nothing permanent.
MEMORY {
    BOOT: start = $0D00, size = $0100, file = "m8sdboot.bin";
    LC:   start = $E000, size = $1700, file = %O;
}
SEGMENTS {
    BOOT:   load = BOOT, type = rw;
    UICODE: load = LC,   type = rw, define = yes;
}
SYMBOLS {
    # Where the copier finds the payload (asm/m8.s imports it).
    UIPAYLOAD: type = export, value = $0E00;
}
